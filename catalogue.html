<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vismaad Creations — Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --cream:#fdf8f2;--warm:#fffdf9;--ink:#1a1208;--brown:#5c3d1e;
  --gold:#c9933a;--goldl:#e8b96a;--goldp:#f5e6c8;--border:#e2d4bc;
  --green:#27ae60;--red:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}

/* ── HEADER ── */
.hdr{background:var(--brown);color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.hdr-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;letter-spacing:.5px;}
.hdr-tag{font-size:13px;opacity:.8;margin-top:3px;}
.hdr-phone{font-size:12px;opacity:.7;margin-top:2px;}

/* ── MAIN ── */
.main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}

/* ── PRODUCT GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:20px;}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}

/* ── PRODUCT CARD ── */
.prod-card{background:var(--warm);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(92,61,30,.08);transition:box-shadow .2s;}
.prod-card:hover{box-shadow:0 6px 24px rgba(92,61,30,.15);}
.prod-info{padding:14px 16px;}
.prod-no{font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;}
.prod-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--brown);margin-top:2px;}
.prod-fabric{font-size:12px;color:#888;margin-top:2px;}

/* ── VARIANT STRIP ── */
.variants-wrap{padding:0 16px 14px;}
.variant-item{margin-bottom:14px;}
.variant-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.variant-label{font-size:13px;font-weight:600;color:var(--ink);}
.variant-price{font-size:14px;font-weight:700;color:var(--brown);}

/* ── PHOTO CAROUSEL ── */
.photo-carousel{position:relative;overflow:hidden;border-radius:10px;background:var(--goldp);}
.photo-track{display:flex;transition:transform .3s ease;will-change:transform;}
.photo-slide{flex-shrink:0;width:100%;}
.photo-slide img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;}
.photo-slide .no-photo{width:100%;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;background:var(--goldp);}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:all .15s;}
.carousel-btn:hover{background:#fff;}
.carousel-prev{left:8px;}
.carousel-next{right:8px;}
.carousel-dots{display:flex;justify-content:center;gap:5px;margin-top:6px;}
.carousel-dot{width:6px;height:6px;border-radius:50%;background:var(--border);cursor:pointer;transition:background .2s;}
.carousel-dot.active{background:var(--gold);}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.b-green{background:#dff0d8;color:var(--green);}
.b-red{background:#fde8e8;color:var(--red);}

/* ── ACTION BUTTONS ── */
.prod-actions{display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap;}
.btn-wa{background:#25d366;color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;flex:1;justify-content:center;min-height:44px;transition:background .15s;}
.btn-wa:hover{background:#1ebe5d;}
.btn-reel{background:transparent;color:var(--brown);border:1.5px solid var(--brown);border-radius:10px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;flex:1;justify-content:center;min-height:44px;transition:all .15s;text-decoration:none;}
.btn-reel:hover{background:var(--goldp);}

/* ── SOLD OUT OVERLAY ── */
.soldout-overlay{position:absolute;inset:0;background:rgba(26,18,8,.55);display:flex;align-items:center;justify-content:center;border-radius:10px;}
.soldout-tag{background:var(--red);color:#fff;padding:6px 18px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:.5px;}

/* ── LOADING / EMPTY ── */
.loading{text-align:center;padding:60px 20px;color:#aaa;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;}
.empty-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--brown);margin-bottom:8px;}
.empty-sub{font-size:14px;color:#888;}

/* ── FOOTER ── */
footer{background:var(--brown);color:rgba(255,255,255,.8);text-align:center;padding:24px 20px;font-size:13px;margin-top:40px;}
footer strong{color:#fff;}

/* ── STATS BAR ── */
.stats-bar{background:var(--warm);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px;}
.stats-item{font-size:13px;color:#888;}
.stats-item strong{color:var(--brown);}
</style>
</head>
<body>

<div class="hdr" id="hdr">
  <div class="hdr-name" id="hdr-name">Vismaad Creations</div>
  <div class="hdr-tag" id="hdr-tag">Premium Unstitched Suits</div>
  <div class="hdr-phone" id="hdr-phone"></div>
</div>

<div class="main">
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      Loading collection…
    </div>
  </div>
</div>

<footer id="footer">
  <strong>Vismaad Creations</strong><br/>
  <span id="footer-contact"></span>
</footer>

<script>
'use strict';

// ── CONFIG ──
// Catalogue Google Sheet ID — read from URL param or hardcoded
const SHEET_ID = getParam('sheet') || '1-rtn3pZsJJ09gbk5llf2rKkkDsmmy9SXz1bl00vGS1I';
// Apps Script URL — must be the same deployed script (it reads from sheetId param)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpfwN3NXnsxyOnYUyiMvEYCLJJaqzFqzuIWMSJ2XLucP6LEHZ4nLhGuuew2HtDmEIgbQ/exec';

function getParam(k){ const u=new URLSearchParams(window.location.search); return u.get(k)||''; }

// ── LOAD DATA VIA JSONP ──
function loadCatalogue() {
  const cb = '_cat_cb_' + Date.now();
  const s = document.createElement('script');
  const timer = setTimeout(() => {
    delete window[cb]; try{document.head.removeChild(s);}catch{}
    showError('Failed to load catalogue — please try refreshing.');
  }, 20000);
  window[cb] = data => {
    clearTimeout(timer); delete window[cb]; try{document.head.removeChild(s);}catch{}
    renderCatalogue(data.rows || []);
  };
  s.onerror = () => {
    clearTimeout(timer); delete window[cb];
    showError('Failed to load catalogue — please check connection.');
  };
  s.src = `${SCRIPT_URL}?action=read&sheet=Catalogue&sheetId=${encodeURIComponent(SHEET_ID)}&callback=${cb}`;
  document.head.appendChild(s);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderCatalogue(rows) {
  // Filter in-stock only
  const products = rows.filter(r => r.inStock === '1' || r.inStock === 1 || r.inStock === true);

  const app = document.getElementById('app');
  if (!products.length) {
    app.innerHTML = `<div class="empty"><div class="empty-title">Collection coming soon</div><div class="empty-sub">No products available right now. Check back soon!</div></div>`;
    return;
  }

  // Sort by prodNo
  products.sort((a,b) => (parseInt(a.prodNo)||0) - (parseInt(b.prodNo)||0));

  const statsBar = `<div class="stats-bar">
    <div class="stats-item">🧵 <strong>${products.length}</strong> designs available</div>
    <div class="stats-item" style="font-size:12px;color:#aaa;">Updated ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div>
  </div>`;

  const cards = products.map(p => buildCard(p)).join('');
  app.innerHTML = statsBar + `<div class="grid">${cards}</div>`;

  // Init all carousels
  document.querySelectorAll('.photo-carousel[data-carousel]').forEach(initCarousel);
}

function parseVariants(raw) {
  if (!raw) return [];
  try { return typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { return []; }
}

function buildCard(p) {
  const waNumber = p.waNumber || '';
  const prodName = p.name || '';
  const variants = parseVariants(p.variants);
  const inStock = p.inStock === '1' || p.inStock === 1;
  const stockBadge = inStock
    ? '<span class="badge b-green">✓ In Stock</span>'
    : '<span class="badge b-red">Sold Out</span>';

  let variantsHtml = '';
  if (variants.length) {
    variantsHtml = `<div class="variants-wrap">` +
      variants.map((v, vi) => {
        const photos = v.photos || [];
        const price = v.price || p.sellPrice;
        const priceHtml = price ? `<span class="variant-price">₹${parseFloat(price).toLocaleString('en-IN')}</span>` : '';
        const labelHtml = v.label ? `<span class="variant-label">${esc(v.label)}</span>` : `<span class="variant-label">Design ${vi+1}</span>`;

        let photosHtml = '';
        if (photos.length === 0) {
          photosHtml = `<div class="photo-carousel"><div class="photo-slide"><div class="no-photo">No photo yet</div></div></div>`;
        } else if (photos.length === 1) {
          photosHtml = `<div class="photo-carousel">
            <div class="photo-track"><div class="photo-slide"><img src="${esc(photos[0].thumbUrl||photos[0].fullUrl)}" loading="lazy" alt="${esc(v.label||'Product photo')}"/></div></div>
            ${!inStock?'<div class="soldout-overlay"><span class="soldout-tag">Sold Out</span></div>':''}
          </div>`;
        } else {
          const carouselId = `c-${p.prodNo}-${vi}`;
          const slides = photos.map((ph, pi) =>
            `<div class="photo-slide"><img src="${esc(ph.thumbUrl||ph.fullUrl)}" loading="lazy" alt="${esc(v.label||'Photo '+pi)}"/></div>`
          ).join('');
          const dots = photos.map((_,pi) => `<div class="carousel-dot ${pi===0?'active':''}" onclick="goToSlide('${carouselId}',${pi})"></div>`).join('');
          photosHtml = `<div class="photo-carousel" data-carousel="${carouselId}" data-total="${photos.length}" data-cur="0">
            <div class="photo-track" id="track-${carouselId}">${slides}</div>
            ${photos.length>1?`<button class="carousel-btn carousel-prev" onclick="carouselPrev('${carouselId}')">‹</button><button class="carousel-btn carousel-next" onclick="carouselNext('${carouselId}')">›</button>`:''}
            ${!inStock?'<div class="soldout-overlay"><span class="soldout-tag">Sold Out</span></div>':''}
          </div>
          <div class="carousel-dots" id="dots-${carouselId}">${dots}</div>`;
        }

        return `<div class="variant-item">
          <div class="variant-label-row">${labelHtml}${priceHtml}</div>
          ${photosHtml}
        </div>`;
      }).join('') + `</div>`;
  } else if (p.sellPrice) {
    variantsHtml = `<div style="padding:0 16px 10px;font-size:18px;font-weight:700;color:var(--brown);">₹${parseFloat(p.sellPrice).toLocaleString('en-IN')}</div>`;
  }

  // WhatsApp enquiry URL
  const waNum = (p.waNumber || getGlobalWA()).replace(/\D/g,'');
  const waMsg = `Hi, I'm interested in Product #${p.prodNo} — ${prodName}${variants.length?' (please share available colours/designs)':''}.`;
  const waUrl = waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent(waMsg)}` : '';
  const reelUrl = p.reelUrl || '';

  const actionsHtml = `<div class="prod-actions">
    ${waUrl?`<a href="${waUrl}" target="_blank" class="btn-wa">💬 Enquire on WhatsApp</a>`:''}
    ${reelUrl?`<a href="${esc(reelUrl)}" target="_blank" class="btn-reel">▶ View Reel</a>`:''}
  </div>`;

  return `<div class="prod-card">
    <div class="prod-info">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="prod-no">Article #${p.prodNo}</div>
        ${stockBadge}
      </div>
      <div class="prod-name">${esc(prodName)}</div>
      ${p.fabric?`<div class="prod-fabric">${esc(p.fabric)}</div>`:''}
    </div>
    ${variantsHtml}
    ${actionsHtml}
  </div>`;
}

// ── CAROUSEL ──
function initCarousel(el) { /* carousels are driven by onclick handlers */ }

function goToSlide(carouselId, idx) {
  const el = document.querySelector(`[data-carousel="${carouselId}"]`);
  if (!el) return;
  const total = parseInt(el.dataset.total) || 1;
  idx = Math.max(0, Math.min(total - 1, idx));
  el.dataset.cur = idx;
  const track = document.getElementById('track-' + carouselId);
  if (track) track.style.transform = `translateX(-${idx * 100}%)`;
  const dotsEl = document.getElementById('dots-' + carouselId);
  if (dotsEl) dotsEl.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
}

function carouselPrev(carouselId) {
  const el = document.querySelector(`[data-carousel="${carouselId}"]`);
  if (!el) return;
  const cur = parseInt(el.dataset.cur) || 0;
  const total = parseInt(el.dataset.total) || 1;
  goToSlide(carouselId, (cur - 1 + total) % total);
}

function carouselNext(carouselId) {
  const el = document.querySelector(`[data-carousel="${carouselId}"]`);
  if (!el) return;
  const cur = parseInt(el.dataset.cur) || 0;
  const total = parseInt(el.dataset.total) || 1;
  goToSlide(carouselId, (cur + 1) % total);
}

// Swipe support for carousels
let _touchStartX = 0;
document.addEventListener('touchstart', e => { _touchStartX = e.touches[0].clientX; }, {passive: true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - _touchStartX;
  if (Math.abs(dx) < 40) return;
  const carousel = e.target.closest('[data-carousel]');
  if (!carousel) return;
  const id = carousel.dataset.carousel;
  if (dx > 0) carouselPrev(id); else carouselNext(id);
}, {passive: true});

// ── GLOBAL WA NUMBER ──
let _globalWA = '';
function getGlobalWA() { return _globalWA; }

// ── ERROR ──
function showError(msg) {
  const app = document.getElementById('app');
  if (app) app.innerHTML = `<div class="empty"><div class="empty-title">Oops</div><div class="empty-sub">${esc(msg)}</div></div>`;
}

// ── INIT ──
// Try to read business info from a separate settings row (optional)
// For now, rely on hardcoded header values and populate WA from first product row
function init() {
  // Attempt to read settings from sheet
  const settingsCb = '_settings_cb_' + Date.now();
  const s = document.createElement('script');
  const timer = setTimeout(() => {
    delete window[settingsCb]; try{document.head.removeChild(s);}catch{}
    // Fall through — load catalogue anyway
    loadCatalogue();
  }, 8000);
  window[settingsCb] = data => {
    clearTimeout(timer); delete window[settingsCb]; try{document.head.removeChild(s);}catch{}
    const rows = data.rows || [];
    // Look for a settings row
    const settings = rows.find(r => r.id === 'cat_settings' || r.type === 'settings');
    if (settings) {
      if (settings.bizName) document.getElementById('hdr-name').textContent = settings.bizName;
      if (settings.tagline) document.getElementById('hdr-tag').textContent = settings.tagline;
      if (settings.phone) {
        document.getElementById('hdr-phone').textContent = '📞 ' + settings.phone;
        document.getElementById('footer-contact').textContent = settings.phone;
      }
      if (settings.waNumber) _globalWA = settings.waNumber;
    }
    loadCatalogue();
  };
  s.onerror = () => { clearTimeout(timer); delete window[settingsCb]; loadCatalogue(); };
  // Try to read settings from same catalogue sheet
  s.src = `${SCRIPT_URL}?action=read&sheet=CatSettings&sheetId=${encodeURIComponent(SHEET_ID)}&callback=${settingsCb}`;
  document.head.appendChild(s);
}

init();
</script>
</body>
</html>
